<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test API</title>
<style>
  body { font-family: Arial; padding: 30px; background: #f4f4f4; }
  h1 { color: #8B0000; }
  button { padding: 12px 24px; font-size: 1rem; margin: 10px 5px; cursor: pointer;
           background: #8B0000; color: white; border: none; border-radius: 8px; }
  button:hover { background: #A50000; }
  pre { background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd;
        overflow: auto; max-height: 400px; margin-top: 20px; }
  .ok { color: green; font-weight: bold; }
  .err { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1>Test des APIs</h1>

<h2>1. Créer l'admin</h2>
<button onclick="testInit()">Créer admin</button>

<h2>2. Tester la connexion</h2>
<button onclick="testAuth()">Tester /api/auth</button>

<h2>3. Vérifier mes APIs</h2>
<button onclick="testListe()">Tester /api/liste (doit refuser)</button>

<h2>Résultat :</h2>
<pre id="resultat">Clique sur un bouton ci-dessus...</pre>

<script>
const res = document.getElementById("resultat");

function afficher(texte, ok) {
  res.innerHTML = (ok ? '<span class="ok">✅ SUCCÈS</span>' : '<span class="err">❌ ÉCHEC</span>')
    + "\n\n" + texte;
}

async function testInit() {
  res.textContent = "En cours...";
  try {
    const r = await fetch("/api/init", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: "admin",
        password: "mehadmin1234",
        nom_complet: "Administrateur MEH"
      })
    });
    const data = await r.json();
    afficher("Status: " + r.status + "\nRéponse:\n" + JSON.stringify(data, null, 2), r.ok);
  } catch (e) {
    afficher("Erreur: " + e.message, false);
  }
}

async function testAuth() {
  res.textContent = "En cours...";
  try {
    const r = await fetch("/api/auth", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: "admin",
        password: "mehadmin1234"
      })
    });
    const data = await r.json();
    afficher("Status: " + r.status + "\nRéponse:\n" + JSON.stringify(data, null, 2), r.ok);
  } catch (e) {
    afficher("Erreur: " + e.message, false);
  }
}

async function testListe() {
  res.textContent = "En cours...";
  try {
    const r = await fetch("/api/liste");
    const texte = await r.text();
    afficher("Status: " + r.status + " (doit être 401)\nRéponse:\n" + texte, r.status === 401);
  } catch (e) {
    afficher("Erreur: " + e.message, false);
  }
}
</script>
</body>
</html>
