<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEH - Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
      <img src="logo.png" class="logo">

      <h1>Maranatha École Hôtelière & Service Traiteur</h1>

      <p>Former pour agir</p>
  </header>

  <main class="container">

      <h2>Formulaire d'inscription</h2>

      <form id="form">

          <input type="text" placeholder="Nom" required>

          <input type="text" placeholder="Prénom" required>

          <input type="tel" placeholder="Téléphone" required>

          <input type="email" placeholder="Email">

          <h3>Choisissez votre option</h3>

          <select required>

              <option value="">Sélectionnez</option>

              <option>Cuisine et Pâtisserie (6 mois)</option>

              <option>Décoration de gâteau (3 mois)</option>

              <option>Art culinaire (10 mois)</option>

              <option>Cuisine, Pâtisserie et Protocole (3 mois)</option>

              <option>Informatique bureautique côté entreprise (6 mois)</option>

          </select>

          <h3>Photo de la pièce d'identité</h3>

          <input type="file" accept="image/*" required>

          <button>S'inscrire</button>

      </form>

  </main>

</body>
</html>
