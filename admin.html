<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration MEH</title>

<link rel="stylesheet" href="style.css">

<!-- ============ STYLES DE CONNEXION (intégrés directement) ============ -->
<style>
.ecran-connexion {
  display: flex !important;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: linear-gradient(135deg, #8B0000, #A50000);
  padding: 20px;
  margin: 0;
}

.ecran-connexion .login-box {
  background: white;
  padding: 40px 30px;
  border-radius: 15px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
}

.ecran-connexion .login-box img.logo {
  width: 100px !important;
  height: 100px !important;
  max-width: 100px !important;
  max-height: 100px !important;
  object-fit: contain;
  margin: 0 auto 15px auto;
  display: block;
  border-radius: 50%;
  background: white;
  padding: 5px;
  border: 3px solid #8B0000;
}

.ecran-connexion .login-box h1 {
  color: #8B0000;
  font-size: 1.5rem;
  margin-bottom: 5px;
}

.ecran-connexion .login-box p {
  color: #666;
  margin-bottom: 25px;
}

.ecran-connexion .login-box form {
  text-align: left;
}

.ecran-connexion .login-box label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
  color: #333;
  font-size: 0.9rem;
}

.ecran-connexion .login-box input {
  width: 100%;
  padding: 12px 15px;
  margin-top: 5px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 1rem;
  font-family: inherit;
  box-sizing: border-box;
}

.ecran-connexion .login-box input:focus {
  outline: none;
  border-color: #8B0000;
  box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
}

.ecran-connexion .login-box button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  font-size: 1.05rem;
  font-weight: bold;
  background: #8B0000;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.ecran-connexion .login-box button:hover {
  background: #A50000;
}

.login-erreur {
  color: #c62828;
  text-align: center;
  margin-top: 15px;
  font-weight: 600;
  min-height: 20px;
}

.user-bar {
  margin-top: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.user-bar span {
  background: rgba(255, 255, 255, 0.2);
  padding: 6px 15px;
  border-radius: 20px;
  font-size: 0.9rem;
  color: white;
}

.user-bar button {
  padding: 6px 15px;
  font-size: 0.85rem;
  background: #444;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

</head>
<body>

<!-- ============ ÉCRAN DE CONNEXION ============ -->
<div id="ecran-connexion" class="ecran-connexion">
  <div class="login-box">
    <img src="logo.png" class="logo" alt="Logo MEH">
    <h1>Administration MEH</h1>
    <p>Veuillez vous connecter</p>

    <form id="form-connexion" onsubmit="connexion(event)">
      <label>Nom d'utilisateur</label>
      <input type="text" id="login-username" required autocomplete="username">

      <label>Mot de passe</label>
      <input type="password" id="login-password" required autocomplete="current-password">

      <button type="submit">🔐 Se connecter</button>

      <p id="login-erreur" class="login-erreur"></p>
    </form>
  </div>
</div>

<!-- ============ APPLICATION (cachée au départ) ============ -->
<div id="app" style="display:none;">

  <header class="hero">
    <img src="logo.png" class="logo" alt="Logo MEH">
    <h1>Administration MEH</h1>
    <p>Maranatha École Hôtelière & Service Traiteur</p>
    <div class="user-bar">
      <span id="user-info">👤 —</span>
      <button onclick="deconnexion()">Déconnexion</button>
    </div>
  </header>

  <div class="container">
    <h2>Étudiants inscrits</h2>

    <input
      type="text"
      id="recherche"
      placeholder="🔎 Rechercher par nom, prénom, numéro, téléphone..."
      style="margin-bottom: 15px;"
    >

    <table id="table">
      <thead>
        <tr>
          <th>N°</th>
          <th>Numéro</th>
          <th>Nom</th>
          <th>Prénom</th>
          <th>Option</th>
          <th>Téléphone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- MODAL D'ÉDITION -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="fermerModal()">&times;</span>
      <h2>Modifier l'inscription</h2>

      <form id="form-modifier" onsubmit="sauvegarderModif(event)">
        <input type="hidden" id="edit-id">

        <label>Nom</label>
        <input type="text" id="edit-nom" required>

        <label>Prénom</label>
        <input type="text" id="edit-prenom" required>

        <label>Sexe</label>
        <select id="edit-sexe">
          <option value="">Choisir</option>
          <option value="Masculin">Masculin</option>
          <option value="Féminin">Féminin</option>
        </select>

        <label>Date de naissance</label>
        <input type="date" id="edit-naissance">

        <label>Lieu de naissance</label>
        <input type="text" id="edit-lieu">

        <label>Adresse complète</label>
        <textarea id="edit-adresse"></textarea>

        <label>Téléphone</label>
        <input type="tel" id="edit-telephone">

        <label>Email</label>
        <input type="email" id="edit-email">

        <label>Option de formation</label>
        <input type="text" id="edit-option">

        <label>Nom du parent / tuteur</label>
        <input type="text" id="edit-parent">

        <label>Téléphone du parent</label>
        <input type="tel" id="edit-tel-parent">

        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="submit" style="flex:1;">💾 Enregistrer</button>
          <button type="button" onclick="fermerModal()" style="flex:1; background:#666;">Annuler</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="admin.js"></script>

</body>
</html>
